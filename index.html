
<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIKSOM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:white;font-family:Arial}
header{position:fixed;top:0;left:0;width:100%;z-index:5;display:flex;justify-content:space-around;padding:18px 5px;background:#0008}
.logo{color:#c5e85a;font-weight:bold;font-size:23px}
.tabs{display:flex;gap:15px;font-size:14px}
.tabs b{border-bottom:2px solid white;padding-bottom:5px}
.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}
.post{height:100dvh;position:relative;scroll-snap-align:start;background:#181818}
.post video{width:100%;height:100%;object-fit:cover}
.info{position:absolute;bottom:95px;left:15px;right:85px;text-shadow:0 1px 4px black}
.info p{font-size:14px}
.actions{position:absolute;right:13px;bottom:115px;display:grid;gap:23px;text-align:center}
.actions button{background:none;color:white;border:0;font-size:27px}
.actions small{display:block;font-size:12px}
nav{position:fixed;bottom:0;width:100%;background:#080808;display:flex;justify-content:space-around;padding:12px 3px;z-index:8}
nav button{background:none;color:white;border:0;font-size:12px}
nav span{display:block;font-size:23px;margin-bottom:4px}
.upload{position:fixed;top:70px;right:12px;z-index:9;background:#c5e85a;color:black;padding:9px;border-radius:9px;font-weight:bold}
#file{display:none}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px}
</style>
</head>
<body>
<header>
<div class="logo">TIKSOM 🌍</div>
<div class="tabs"><span>Following</span><b>For You</b></div>
<div>⌕</div>
</header>

<label class="upload" for="file">＋ Upload</label>
<input id="file" type="file" accept="video/*" multiple>

<div class="feed" id="feed">
<div class="post">
<div class="empty">
<div>
<h1 style="color:#c5e85a">TIKSOM</h1>
<h2>Ku soo dhawoow!</h2>
<p>La wadaag muuqaaladaada dunida.</p>
<p>Riix Upload si aad video u geliso.</p>
</div>
</div>
<div class="info"><b>@TIKSOM</b><p>Bilowga bulshada muuqaalada caalamka ❤️</p></div>
<div class="actions">
<button onclick="like(this)">❤️<small>0</small></button>
<button onclick="comment()">💬<small>0</small></button>
<button onclick="share()">↗<small>Share</small></button>
</div>
</div>
</div>

<nav>
<button><span>⌂</span>Home</button>
<button><span>♧</span>Friends</button>
<button onclick="document.getElementById('file').click()"><span>➕</span>Upload</button>
<button><span>✉</span>Inbox</button>
<button><span>♙</span>Profile</button>
</nav>

<script>
function like(btn){
let n=Number(btn.dataset.n||0)+1;
btn.dataset.n=n;
btn.querySelector('small').textContent=n;
}
function comment(){
let c=prompt("Qor faalladaada:");
if(c) alert("Faalladaada: "+c);
}
function share(){
if(navigator.share){
navigator.share({title:"TIKSOM",text:"Daawo TIKSOM!"});
}else{
alert("La wadaag TIKSOM asxaabtaada!");
}
}
document.getElementById('file').addEventListener('change',function(){
for(const f of this.files){
const url=URL.createObjectURL(f);
const post=document.createElement('div');
post.className='post';
post.innerHTML=`
<video controls autoplay loop playsinline></video>
<div class="info"><b>@TIKSOM User</b><p>Video cusub 🌍</p></div>
<div class="actions">
<button onclick="like(this)">❤️<small>0</small></button>
<button onclick="comment()">💬<small>0</small></button>
<button onclick="share()">↗<small>Share</small></button>
</div>`;
post.querySelector('video').src=url;
document.getElementById('feed').prepend(post);
}
this.value='';
});
</script>
</body>
</html>
